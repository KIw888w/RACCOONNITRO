<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,600;0,800;1,800&family=Russo+One&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<style>
:root{--bg:#04060d;--pn:#0b1224;--pn2:#101a33;--ln:#1e2d52;--tx:#eef3ff;--mu:#8fa0c4;--bl:#2f9bff;--bl2:#69c4ff;--go:#ffc21a;--go2:#ff9d00;--rd:#ff4d5e;--ok:#3ddc97;
box-sizing:border-box;color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#0d2a5e55,transparent),radial-gradient(900px 500px at -10% 30%,#3a2a0033,transparent),var(--bg);color:var(--tx);font:400 16px/1.55 'Kanit',system-ui,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--go)}button,input,select,textarea{font:inherit;color:inherit}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.top,nav.menu,main,footer{position:relative;z-index:1}
.disp{font-family:'Russo One','Kanit',sans-serif;letter-spacing:.03em}
/* header */
.top{display:flex;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;background:#02040acc;backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;margin-right:auto;text-decoration:none;color:inherit}
.brand img{width:52px;height:52px;border-radius:14px;box-shadow:0 0 0 2px var(--go),0 0 22px #2f9bff88;animation:pulse 3s ease-in-out infinite}
.brand b{font-size:22px;line-height:1;background:linear-gradient(90deg,var(--bl2),var(--bl) 45%,var(--go) 55%,var(--go2));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:shine 6s linear infinite}
.brand small{display:block;font-size:11px;color:var(--mu);letter-spacing:.25em;margin-top:2px}
.auth{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--ln);background:var(--pn);padding:6px 14px;border-radius:99px;font-weight:600;display:flex;gap:6px;align-items:center}
.chip i{color:var(--go);font-style:normal}
nav.menu{display:flex;gap:4px;padding:0 16px;background:linear-gradient(180deg,#0a1530,#070d1e);border-top:1px solid var(--ln);border-bottom:2px solid var(--bl);position:sticky;top:0;z-index:20;overflow-x:auto;box-shadow:0 8px 30px #0008}
nav.menu a{padding:13px 20px;color:var(--mu);text-decoration:none;font-weight:600;white-space:nowrap;position:relative;transition:color .25s;cursor:pointer;font-size:15px}
nav.menu a:after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;background:linear-gradient(90deg,var(--bl),var(--go));transform:scaleX(0);transition:transform .3s;border-radius:3px}
nav.menu a:hover,nav.menu a.on{color:#fff}nav.menu a:hover:after,nav.menu a.on:after{transform:scaleX(1)}
/* buttons */
.btn{border:0;cursor:pointer;padding:10px 22px;font-weight:800;color:#1a1200;background:linear-gradient(180deg,var(--go),var(--go2));clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);position:relative;transition:transform .2s,filter .2s;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12) drop-shadow(0 0 10px #ffc21a99)}.btn:active{transform:translateY(0) scale(.97)}
.btn.bl{background:linear-gradient(180deg,var(--bl2),var(--bl));color:#001430}.btn.bl:hover{filter:brightness(1.12) drop-shadow(0 0 10px #2f9bffaa)}
.btn.gh{background:#12203f;color:var(--tx)}.btn.rd{background:linear-gradient(180deg,#ff7482,var(--rd));color:#fff}.btn.sm{padding:6px 14px;font-size:14px}
:focus-visible{outline:2px solid var(--go);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.page{animation:pgIn .55s cubic-bezier(.2,.8,.2,1) both}.page.out{animation:pgOut .26s cubic-bezier(.5,0,.75,0) forwards;pointer-events:none}
h2.sec{font-size:26px;margin:38px 0 16px;display:flex;align-items:center;gap:12px}
h2.sec:before{content:"";width:6px;height:26px;background:linear-gradient(var(--go),var(--bl));border-radius:3px;transform:skewX(-15deg)}
h2.sec a{margin-left:auto;font-size:14px;font-family:Kanit;font-weight:600;text-decoration:none}
/* slider */
.slider{position:relative;height:clamp(280px,44vw,430px);border-radius:20px;overflow:hidden;border:1px solid var(--ln);box-shadow:0 0 0 1px #2f9bff33,0 20px 60px #0009}
.sl{position:absolute;inset:0;display:flex;align-items:center;padding:0 clamp(20px,6vw,70px);opacity:0;visibility:hidden;overflow:hidden}
.sl.on{opacity:1;visibility:visible;z-index:2}.sl.leave{opacity:1;visibility:visible;z-index:1}
.sl.enter{animation:slIn 1s cubic-bezier(.77,0,.18,1) both}.sl.leave{animation:slOut 1s cubic-bezier(.77,0,.18,1) both}
.sl.enter .bg{animation:bgIn 1.2s cubic-bezier(.2,.8,.2,1) both}
.sl.enter:after{content:"";position:absolute;top:0;bottom:0;left:-45%;width:34%;z-index:4;pointer-events:none;background:linear-gradient(100deg,transparent,#ffffff30,transparent);transform:skewX(-20deg);animation:sweep 1.1s .1s ease-out both}
.sl.arrive .art{animation:float 4s ease-in-out infinite,artIn 1s cubic-bezier(.2,.9,.25,1.15) .2s both}
.sl .bg{position:absolute;inset:-4%;z-index:0;transform:scale(1.12)}.sl.on .bg{transform:scale(1);transition:transform 7s linear}.sl.leave .bg{transform:scale(1);transition:none}
.sl .tx{position:relative;z-index:2;max-width:560px}
.sl .tx>*{opacity:0}.sl.on .tx>*{animation:txIn .8s cubic-bezier(.2,.8,.2,1) .35s both}.sl.leave .tx>*{opacity:1;animation:none}
.sl.on .tx>:nth-child(2){animation-delay:.5s}.sl.on .tx>:nth-child(3){animation-delay:.65s}.sl.on .tx>:nth-child(4){animation-delay:.8s}
.sl .tag{display:inline-block;background:#ffc21a22;border:1px solid var(--go);color:var(--go);padding:2px 14px;border-radius:99px;font-size:13px;font-weight:600}
.sl h1{font-size:clamp(30px,6vw,60px);line-height:1.02;margin:12px 0;font-family:'Russo One';text-transform:uppercase;text-shadow:0 4px 24px #000a}
.sl h1 em{font-style:normal;color:var(--go)}
.sl p{color:#cfe0ff;margin:0 0 18px;max-width:440px}
.sl .art{position:absolute;right:clamp(10px,5vw,70px);top:50%;width:clamp(150px,32vw,340px);z-index:1;transform:translateY(-50%);opacity:.95;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 40px #2f9bffaa)}
.sl .art.big{font-size:clamp(100px,22vw,240px);text-align:center;line-height:1;width:auto}
.arr{position:absolute;top:50%;z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff44;background:#000a;color:#fff;font-size:20px;cursor:pointer;transform:translateY(-50%);transition:.2s}.arr:hover{background:var(--bl);border-color:var(--bl2)}
.arr.l{left:12px}.arr.r{right:12px}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:5}
.dots i{width:34px;height:5px;border-radius:5px;background:#ffffff33;cursor:pointer;overflow:hidden;position:relative}
.dots i.on:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bl2),var(--go));transform-origin:left;animation:fill 6s linear forwards}
/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.cat{background:linear-gradient(160deg,var(--pn2),var(--pn));border:1px solid var(--ln);border-radius:16px;padding:18px;cursor:pointer;position:relative;overflow:hidden;transition:transform .3s,border-color .3s,box-shadow .3s}
.cat:hover{transform:translateY(-6px);border-color:var(--go);box-shadow:0 10px 30px #ffc21a22}
.cat .ic{font-size:38px;display:block;transition:transform .4s}.cat:hover .ic{transform:scale(1.2) rotate(-8deg)}
.cat b{display:block;margin-top:6px}.cat span{color:var(--mu);font-size:13px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.pill{border:1px solid var(--ln);background:var(--pn);padding:7px 16px;border-radius:99px;cursor:pointer;font-weight:600;color:var(--mu);transition:.2s}
.pill:hover{color:#fff;border-color:var(--bl)}.pill.on{background:linear-gradient(90deg,var(--bl),#1e6fd0);color:#fff;border-color:var(--bl2);box-shadow:0 0 18px #2f9bff66}
.search{width:100%;max-width:420px}
/* products */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pc{background:linear-gradient(170deg,var(--pn2),var(--pn));border:1px solid var(--ln);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative;transition:transform .3s,box-shadow .3s,border-color .3s}
.pc:hover{transform:translateY(-6px);border-color:var(--bl);box-shadow:0 12px 34px #2f9bff33}
.pc:after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,#ffffff18,transparent);transform:skewX(-20deg);transition:left .7s;pointer-events:none}.pc:hover:after{left:130%}
.th{height:130px;display:grid;place-items:center;font-size:52px;background:radial-gradient(circle at 50% 120%,#2f9bff55,transparent 70%),repeating-linear-gradient(135deg,#0f1c3a 0 12px,#0b1426 12px 24px);background-size:cover;background-position:center}
.bd{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.tg{font-size:12px;color:var(--bl2)}.pr{color:var(--go);font-size:22px;font-weight:800}.pr small{font-size:13px;color:var(--mu);font-weight:400}
.st{font-size:13px;color:var(--ok)}.st.no{color:var(--rd)}
.ribbon{position:absolute;top:10px;left:10px;background:var(--rd);color:#fff;font-size:12px;font-weight:800;padding:2px 10px;border-radius:6px;z-index:2}.ribbon.hot{background:linear-gradient(90deg,var(--go2),var(--rd))}
/* stats & steps */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stat{text-align:center;padding:20px;border:1px solid var(--ln);border-radius:16px;background:var(--pn)}
.stat b{font-size:38px;display:block;color:var(--go);font-family:'Russo One'}.stat span{color:var(--mu);font-size:14px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.step{padding:18px;border-radius:16px;border:1px solid var(--ln);background:var(--pn)}.step i{font-style:normal;font-size:30px}
.cta{margin-top:40px;padding:34px;border-radius:20px;text-align:center;background:linear-gradient(120deg,#0d2a66,#152b5f 50%,#4a3600);border:1px solid var(--bl);position:relative;overflow:hidden}
.cta:before{content:"";position:absolute;inset:0;background:conic-gradient(from 0deg,transparent,#2f9bff33,transparent 30%);animation:spin 8s linear infinite}
.cta>*{position:relative}
/* forms */
.box{background:linear-gradient(170deg,var(--pn2),var(--pn));border:1px solid var(--ln);border-radius:20px;padding:24px;max-width:440px;margin:26px auto;box-shadow:0 0 50px #2f9bff22}
label{display:block;margin:12px 0 4px;color:var(--mu);font-size:14px}
input,select,textarea{width:100%;background:#060b18;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--bl);box-shadow:0 0 0 3px #2f9bff33;outline:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input,.row select{flex:1 1 150px;width:auto}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tbl{overflow-x:auto;border:1px solid var(--ln);border-radius:14px;background:var(--pn)}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--ln);padding:10px 12px;text-align:left;white-space:nowrap}th{color:var(--bl2);background:#0d1830}
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:16px;z-index:50;animation:fade .25s;backdrop-filter:blur(4px)}
.modal>div{background:var(--pn);border:1px solid var(--bl);border-radius:20px;max-width:500px;width:100%;padding:20px;max-height:90vh;overflow:auto;animation:pop .35s cubic-bezier(.2,1.2,.3,1);box-shadow:0 0 60px #2f9bff44}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pn2);border:1px solid var(--go);padding:10px 22px;border-radius:99px;z-index:99;animation:up .4s,fade .4s 2.6s reverse forwards;font-weight:600}
.msg{color:var(--go);min-height:22px;margin:6px 0}.fill{color:var(--go);border:1px dashed var(--go);padding:0 8px;border-radius:6px}.mu{color:var(--mu)}
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:16px 0}.pk .cat{text-align:center}.pk .cat b{font-size:26px;color:var(--go)}
footer{border-top:1px solid var(--ln);padding:26px 16px;text-align:center;color:var(--mu);background:#02040acc}
.rv{opacity:0;transform:translateY(26px);transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
@keyframes pg{from{opacity:0;transform:translateY(16px)}}@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.85)}}@keyframes float{50%{transform:translateY(-54%)}}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--go),0 0 36px #2f9bffcc}}@keyframes shine{to{background-position:-200% 0}}
@keyframes fill{from{transform:scaleX(0)}}@keyframes spin{to{transform:rotate(1turn)}}
@keyframes slIn{from{transform:translateX(calc(var(--sd,1)*100%))}}
@keyframes slOut{to{transform:translateX(calc(var(--sd,1)*-32%)) scale(.94);opacity:0;filter:brightness(.35)}}
@keyframes bgIn{from{translate:calc(var(--sd,1)*-10%) 0}}
@keyframes artIn{from{translate:calc(var(--sd,1)*160px) 0;scale:.6;rotate:calc(var(--sd,1)*14deg);opacity:0}}
@keyframes txIn{from{opacity:0;transform:translateX(calc(var(--sd,1)*56px));filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes sweep{from{left:-45%}to{left:145%}}
@keyframes pgIn{from{opacity:0;transform:translate(var(--dx,0px),18px) scale(.985);filter:blur(5px)}}
@keyframes pgOut{to{opacity:0;transform:translate(calc(var(--dx,0px)*-.8),-10px) scale(.985);filter:blur(4px)}}
@keyframes fadeOut{to{opacity:0}}@keyframes popOut{to{opacity:0;transform:scale(.88) translateY(12px)}}
.modal.out{animation:fadeOut .22s forwards}.modal.out>div{animation:popOut .22s forwards}
.cat.sel{border-color:var(--go);box-shadow:0 0 0 1px var(--go),0 10px 30px #ffc21a33}
.bdg{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}.bdg.go{color:var(--go)}.bdg.ok{color:var(--ok)}.bdg.rd{color:var(--rd)}
.slip{max-width:160px;max-height:160px;border-radius:10px;margin-top:8px;border:1px solid var(--ln);display:block}
.pw{position:relative}.pw input{padding-right:44px;width:100%}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:17px;opacity:.65;padding:6px 8px;transition:opacity .2s;line-height:1}
.eye:hover{opacity:1}
.pmtabs{display:flex;gap:8px;margin-bottom:14px}.pmtabs .pill{flex:1;text-align:center}
.note{font-size:12px;color:var(--mu);margin-top:6px}
.tsec{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
@media (prefers-reduced-motion:reduce){.sl.leave{visibility:hidden}*,*:before,*:after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.sl .tx>*{opacity:1;transform:none}}
@media(max-width:640px){.top{padding-left:12px;padding-right:12px}.brand b{font-size:17px}.brand img{width:42px;height:42px}.sl .art{opacity:.25}.arr{display:none}}

 if(tab==="stock")b=`<h2 class="sec disp">Add Product</h2><div class="row"><input id="pn" placeholder="Product name"><select id="pc">${CATS.map(c=>`<option>${c[0]}</option>`).join("")}</select><input id="pp" type="number" min="0" placeholder="Price (points)"></div><p></p><div class="row"><input id="pi" placeholder="Image URL (optional)"><label style="margin:0"><input type="checkbox" id="ph" style="width:auto"> Mark as HOT</label></div><p></p><textarea id="pd" rows="2" placeholder="Description"></textarea><p></p><button class="btn" onclick="addProd()">Add Product</button>
 <h2 class="sec disp">Stock</h2><p class="mu">เพิ่มสต็อกได้เฉพาะเมื่อกรอกข้อมูลสินค้าจริง (ไอดี/รหัส/คีย์) — 1 ชิ้นต่อ 1 บรรทัด</p>`+
 prods.map(p=>`<div class="box" style="max-width:none;margin:0 0 12px;padding:16px"><b>${esc(p.name)}</b> <span class="mu">${esc(p.cat)} · ⚡${p.price} · In stock: ${p.stock.length}</span><textarea id="s_${p.id}" rows="2" placeholder="Enter item data, one per line" style="margin-top:8px"></textarea><div class="row" style="margin-top:8px"><button class="btn sm" onclick="addStock('${p.id}')">Add Stock</button><button class="btn sm gh" onclick="hot('${p.id}')">${p.hot?"Unmark HOT":"Mark HOT"}</button><button class="btn sm rd" onclick="delProd('${p.id}')">Delete</button></div></div>`).join("");
 if(tab==="sales")b=`<h2 class="sec disp">Sales History</h2>`+(orders.length?`<div class="tbl"><table><tr><th>Date</th><th>Buyer</th><th>Product</th><th>Delivered item</th><th>Price</th><th>Code</th></tr>${orders.map(x=>`<tr><td>${fmt(x.t)}</td><td>${esc(x.user)}</td><td>${esc(x.prod)}</td><td>${esc(x.item)}</td><td>${x.price}</td><td>${esc(x.code)}</td></tr>`).join("")}</table></div>`:'<p class="mu">ยังไม่มีสินค้าที่ขายออก</p>');
 if(tab==="codes")b=`<h2 class="sec disp">Discount Codes</h2><div class="row"><input id="cc" placeholder="Code e.g. NITRO10"><input id="cp" type="number" min="1" max="100" placeholder="Discount %"><button class="btn" onclick="addCode()">Add Code</button></div><p class="msg">${msg}</p><div class="tbl"><table>${codes.map((c,i)=>`<tr><td>${esc(c.code)}</td><td>-${c.pct}%</td><td><button class="btn sm rd" onclick="codes.splice(${i},1);save();draw()">Delete</button></td></tr>`).join("")||'<tr><td class="mu">No codes yet</td></tr>'}</table></div>`;
 if(tab==="mem")b=`<h2 class="sec disp">Members</h2><div class="tbl"><table><tr><th>Username</th><th>Points</th><th>Add / remove points</th></tr>${users.map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${u.pts}</td><td><div class="row"><input id="g${i}" type="number" style="width:100px;flex:none"><button class="btn sm" onclick="grant(${i})">Apply</button></div></td></tr>`).join("")||'<tr><td class="mu">No members yet</td></tr>'}</table></div>`;
 if(tab==="tup")b=`<h2 class="sec disp">Top-up Settings</h2><div class="row"><input id="cr" type="number" min="0.01" step="any" value="${cfg.rate}" style="flex:0 0 130px"><span class="mu">พอยท์ต่อ 1 บาท</span></div><p></p><textarea id="cf" rows="3" placeholder="วิธีชำระเงิน / เลขบัญชี / PromptPay (แสดงในหน้า Top Up)">${esc(cfg.pay)}</textarea><p></p><button class="btn sm" onclick="saveCfg()">Save Settings</button>
 <h2 class="sec disp">Top-up Requests</h2>`+(topups.length?`<div class="tbl"><table><tr><th>Date</th><th>User</th><th>Method</th><th>Points</th><th>Amount</th><th>Ref</th><th>Evidence</th><th>Status</th><th></th></tr>${topups.map(x=>`<tr><td>${fmt(x.t)}</td><td>${esc(x.user)}</td><td>${x.method==="tm"?"🧧 TrueMoney":"💠 PromptPay"}</td><td>⚡ ${x.pts}</td><td>${x.baht?"฿"+x.baht:"-"}</td><td>${esc(x.ref)||"-"}</td><td>${x.method==="tm"?`<a class="btn sm gh" href="${esc(x.tmlink)}" target="_blank" rel="noopener">เปิดซอง</a><br><span class="mu" style="font-size:11px">${esc(x.tmcode)}</span>`:(x.slip?`<button class="btn sm gh" onclick="viewSlip('${x.id}')">View slip</button>`+(x.ocr?`<br><span class="mu" style="font-size:11px">OCR: ฿${x.ocr}</span>`:""):"-")}</td><td><span class="bdg ${STL[x.st][1]}">${STL[x.st][0]}</span>${x.why?` <span class="mu">${esc(x.why)}</span>`:""}</td><td>${x.st==="pending"?`<div class="row" style="flex-wrap:nowrap"><button class="btn sm" onclick="tupAct('${x.id}',1)">Approve</button><button class="btn sm rd" onclick="tupAct('${x.id}',0)">Reject</button></div>`:""}</td></tr>`).join("")}</table></div>`:'<p class="mu">ยังไม่มีคำขอเติมพอยท์</p>');
 if(tab==="pcodes")b=`<h2 class="sec disp">Point Codes</h2><div class="row"><input id="gp" type="number" min="1" placeholder="Points ต่อโค้ด"><input id="gn" type="number" min="1" max="50" value="1" placeholder="จำนวนโค้ด"><button class="btn" onclick="genCode()">Generate</button></div><p class="msg">${msg}</p><div class="tbl"><table><tr><th>Code</th><th>Points</th><th>Status</th><th></th></tr>${pcodes.map((c,i)=>`<tr><td>${esc(c.code)}</td><td>⚡ ${c.pts}</td><td>${c.by?`<span class="bdg rd">ใช้แล้ว: ${esc(c.by)}</span>`:'<span class="bdg ok">พร้อมใช้</span>'}</td><td><button class="btn sm rd" onclick="pcodes.splice(${i},1);save();draw()">Delete</button></td></tr>`).join("")||'<tr><td class="mu">No codes yet</td></tr>'}</table></div>`;
 return `<h2 class="sec disp" style="margin-top:8px">Admin Panel</h2><div class="tabs">${T.map(t=>`<button class="btn ${t[0]===tab?'':'gh'}" onclick="tab='${t[0]}';msg='';go(draw)">${t[1]}</button>`).join("")}</div>`+b;
}
function addProd(){const n=$("#pn").value.trim(),p=parseInt($("#pp").value);if(!n||isNaN(p))return toast("กรอกชื่อและราคาสินค้า");prods.push({id:"p"+Date.now(),name:n,cat:$("#pc").value,price:p,desc:$("#pd").value.trim(),img:$("#pi").value.trim(),hot:$("#ph").checked?1:0,stock:[]});save();draw();toast("Product added ✔")}
function addStock(id){const t=$("#s_"+id),it=t.value.split("\n").map(s=>s.trim()).filter(Boolean);if(!it.length){toast("ต้องกรอกข้อมูลสินค้าก่อนถึงจะเพิ่มสต็อกได้");return t.focus()}prods.find(p=>p.id===id).stock.push(...it);save();draw();toast(`Added ${it.length} item(s) ✔`)}
function delProd(id){if(confirm("Delete this product?")){prods=prods.filter(p=>p.id!==id);save();draw()}}
function hot(id){const p=prods.find(x=>x.id===id);p.hot=p.hot?0:1;save();draw()}
function addCode(){const c=$("#cc").value.trim(),p=parseInt($("#cp").value);if(!c||!(p>=1&&p<=100)){msg="กรอกโค้ดและส่วนลด 1-100%";return draw()}if(codes.some(x=>x.code.toLowerCase()===c.toLowerCase())){msg="มีโค้ดนี้แล้ว";return draw()}codes.push({code:c,pct:p});msg="";save();draw()}
function grant(i){const n=parseInt($("#g"+i).value);if(!n)return;users[i].pts=Math.max(0,users[i].pts+n);save();draw()}
/* sparks background */
(function(){const c=$("#fx"),x=c.getContext("2d");if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;let W,H,P=[];
 const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener("resize",rs);
 for(let i=0;i<46;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.6,v:Math.random()*.6+.2,g:Math.random()<.5,a:Math.random()*6});
 (function f(){x.clearRect(0,0,W,H);P.forEach(p=>{p.y-=p.v;p.a+=.03;p.x+=Math.sin(p.a)*.4;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}x.globalAlpha=.35+Math.sin(p.a*2)*.25;x.fillStyle=p.g?"#ffc21a":"#4db3ff";x.shadowBlur=10;x.shadowColor=x.fillStyle;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});requestAnimationFrame(f)})()})();
addEventListener("hashchange",()=>{const a=ORD.indexOf(lastR),b=ORD.indexOf(route());dirv=a===b?0:b>a?1:-1;leave(draw)});draw();
</script></body></html>
